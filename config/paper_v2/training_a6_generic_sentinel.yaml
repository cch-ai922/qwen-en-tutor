# =============================================================================
# paper/training_a6_generic_sentinel.yaml  -  Condition A6
# =============================================================================
#
# Condition: identical to A1 (full 12-stream mix) EXCEPT the 4 persistent
# streams use the GENERIC sentinel ``[SESSION_END]`` instead of the
# axis-specific ``[SESSION_END: persistent_<axis>]`` form. The deployment
# system prompt is also switched (via QWEN_TUTOR_SENTINEL_FORMAT=generic) to
# instruct the model to emit only ``[SESSION_END]``.
#
# Hypothesis under test (paper §5.4.x): A1's 0% sentinel FP rate could come
# from two confounded mechanisms:
#   (a) position-anchored learning ("fire after the third strike"), or
#   (b) axis-label specificity ("emit a string the model has only ever seen
#       in the right axis context").
# A6 holds (a) constant and removes (b). If A6 FP stays at 0%, mechanism
# (a) is sufficient. If A6 FP rises meaningfully above 0%, the axis label
# is doing real work and (b) is load-bearing.
#
# Training streams: same 12 streams as A1
# Pre-req before launching training:
#   1. Generate the A6 persistent data with the generic sentinel:
#        $env:QWEN_TUTOR_SENTINEL_FORMAT="generic"
#        python scripts/regen_persistent_a6.py
#                                       # writes data/sft_filtered_a6_persistent/
#   2. Materialize the combined A6 SFT dir:
#        python scripts/setup_paper_ablation_data.py --conditions a6
#      This hardlinks normal + redirect streams from data/sft_filtered/ and
#      persistent streams from data/sft_filtered_a6_persistent/ into
#      data/sft_filtered_a6/.
#   3. At eval time, set QWEN_TUTOR_SENTINEL_FORMAT=generic for the
#      paper_a6_sft baseline so the deployment system prompt matches the
#      training distribution.
# -----------------------------------------------------------------------------

base_model:
  model_id: "./vendor/models/Qwen_3.5_0.8B-Base"
  tokenizer_id: "./vendor/models/Qwen_3.5_0.8B-Base"
  trust_remote_code: true
  attn_implementation: "sdpa"
  torch_dtype: "bfloat16"
  quantization:
    enabled: true
    load_in_4bit: true
    bnb_4bit_quant_type: "nf4"
    bnb_4bit_compute_dtype: "bfloat16"
    bnb_4bit_use_double_quant: true
  gradient_checkpointing: true

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

sft:
  output_dir: "outputs/paper_v2/a6/sft"
  num_train_epochs: 1
  max_steps: -1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  weight_decay: 0.01
  max_seq_length: 1792
  packing: false
  bf16: true
  fp16: false
  optim: "paged_adamw_8bit"
  logging_steps: 5
  eval_strategy: "no"
  save_strategy: "steps"
  save_steps: 50
  save_total_limit: 2
  load_best_model_at_end: false
  report_to: "none"
  seed: 42
  data:
    sft_filtered_dir: "data/sft_filtered_a6"
    eval_filtered_dir: "data/eval_filtered"
    holdout_dir: "data/holdout"
    mix_ratio_sft: 0.80
    mix_ratio_eval: 0.20
    use_all_data: true
    validation_split: 0.05
    shuffle_seed: 42

logging:
  wandb_project: "qwen-en-tutor"
  wandb_entity: null
  wandb_run_name_prefix: "paper-v2-a6-generic-sentinel"

eval_callback:
  enabled: false

evaluation:
  holdout_dir: data/holdout
  n_per_level: 3
  concurrency: 2
  intermediate_adapter_path: outputs/paper_v2/a6/sft
  final_adapter_path: outputs/paper_v2/a6/sft

comparison:
  threshold: 0.05
  fail_on_regression: false
