# =============================================================================
# generation.yaml  -  1단계: 대화 데이터 생성 + 필터링 설정
# =============================================================================
#
# 이 파일 하나만 보면 데이터 생성 파이프라인의 모든 동작을 알 수 있습니다.
# scripts/run_generation.py 가 이 파일을 읽어 다음 순서로 실행합니다:
#
#   seeds      → CEFR 레벨별 시나리오 시드 생성
#   sft        → 일상 대화(normal) SFT 학습 예시 생성
#   redirect   → 민감 주제로의 리다이렉트(redirect) SFT 예시 생성
#   register   → 격식/비격식 register DPO 페어 생성
#   eval       → /think 모드용 평가(evaluation) 예시 생성
#   filter_*   → 위 네 가지 산출물에 대해 필터 파이프라인 실행
#
# 기본 프로파일은 오프라인 / RTX 3060 / 로컬 llama.cpp(gpt-oss-20b) 입니다.
# 클라우드 API(Anthropic/OpenAI) 로 바꾸려면 teacher.provider 와 judge.provider
# 를 anthropic 또는 openai 로 변경하고 그 아래 블록을 채워 넣으면 됩니다.
# -----------------------------------------------------------------------------


# -----------------------------------------------------------------------------
# teacher  -  데이터를 만들어 주는 "선생" 모델
# -----------------------------------------------------------------------------
# 로컬에서 llama.cpp 가 OpenAI 호환 엔드포인트(/v1/chat/completions)를
# 열어 주므로, provider 는 그대로 openai 로 두고 base_url 만 로컬을 가리킵니다.
# api_key_static 은 llama.cpp 가 실제로 검사하지 않지만 SDK 가 반드시
# 무언가를 요구하므로 의미 없는 값을 넣어 둡니다.
teacher:
  provider: openai
  openai:
    model: gpt-oss-20b
    base_url: http://127.0.0.1:8080/v1
    api_key_env: null
    api_key_static: "sk-no-key-needed"
    max_retries: 3
    initial_retry_seconds: 2.0
    max_retry_seconds: 30.0
    batch:
      enabled: false           # llama.cpp 는 batch 엔드포인트가 없음
      poll_interval_seconds: 30.0
      max_wait_seconds: 86400.0

# -----------------------------------------------------------------------------
# judge  -  필터 단계에서 locale/자연스러움을 LLM 으로 판정할 때 쓰는 모델
# -----------------------------------------------------------------------------
# 12GB VRAM 에서는 teacher 와 judge 를 동시에 띄울 수 없어 같은 로컬 모델을
# 재사용합니다. llama.cpp 는 호출이 stateless 라 한 모델로 두 역할을 합니다.
judge:
  provider: openai
  openai:
    model: gpt-oss-20b
    base_url: http://127.0.0.1:8080/v1
    api_key_env: null
    api_key_static: "sk-no-key-needed"
    max_retries: 3
    initial_retry_seconds: 2.0
    max_retry_seconds: 30.0
    batch:
      enabled: false
      poll_interval_seconds: 30.0
      max_wait_seconds: 86400.0

# -----------------------------------------------------------------------------
# 생성량 / 동시성
# -----------------------------------------------------------------------------
# n_per_level 는 레벨 당 시드 개수. gpt-oss-20b 가 3060 에서 ~5-10 tok/s 라
# 처음에는 작게 시작하는 걸 추천합니다. RTX 5090 로 옮기면 100 정도로 키웁니다.
generation:
  n_per_level: 2                       # smoke: 2 seeds per (level, locale)
  cefr_levels: ["A2", "B1"]            # smoke test 용. 전체는 ["A1","A2","B1","B2","C1","C2"]
  # 어떤 locale(s) 로 데이터를 만들지. ``config/locale.yaml`` 의 ``locales:``
  # 아래에 정의된 key 중에서 골라 적습니다.
  locales: ["china", "japan", "italy"] # multi-locale smoke
  concurrency: 2                       # llama-server 동시 요청 수
  per_call_size: 5                     # seed 한 번 호출당 묶음 크기 (diversity 헤드룸 확보)

  # 같은 시드로 SFT 대화를 몇 번 샘플링할지. smoke 에서는 1 로 두어
  # (level, locale) 당 2 SFT example 만 생성 (총 ~12 normal SFT + redirects).
  dialogues_per_seed: 1

  # ---- redirect / eval 비율 ------------------------------------------------
  # 시드 1개당 normal SFT 는 항상 1 개를 만들지만, redirect 와 eval 은
  # 학습 데이터에서 차지해야 할 비율이 작아서 그만큼만 생성합니다.
  #
  # redirect_fraction: 시드 중 몇 퍼센트에 redirect 변형을 만들지.
  #   실제 대화에서 민감 주제 회피 모먼트는 드물기 때문에 50/50 으로
  #   학습시키면 모델이 정상 질문도 redirect 톤으로 답하는 부작용이 생깁니다.
  #   0.20 = 시드의 20% 만 redirect 화 → 최종 SFT 의 약 17% 가 redirect.
  #
  # eval_fraction: SFT 예시 중 몇 퍼센트로 /think 평가 예시를 만들지.
  #   training.yaml 의 mix_ratio_sft:mix_ratio_eval = 0.80:0.20 = 4:1 과
  #   맞추려면 SFT 풀의 25% 정도가 eval 풀이어야 mix_and_split 이 잘라
  #   버리는 양이 거의 없습니다. 1:1 로 만들고 75% 를 버리는 낭비를 막습니다.
  redirect_fraction: 0.20
  eval_fraction: 0.25

  # ---- user-side violation handler streams --------------------------------
  # redirect_*.jsonl 가 off_topic 의 user-side violation 을 다루듯,
  # locale_redirect_*.jsonl 와 pedagogy_redirect_*.jsonl 는 각각
  # locale_violation 과 pedagogy_weak 의 user-side handling 을 SFT 로
  # 가르칩니다 (학습자가 American 음식을 언급하면 / 문법 강의를 요청하면
  # 튜터가 어떻게 부드럽게 처리하는지). 이 SFT 들의 turn 들은 register_pairs
  # 에서 자동으로 DPO 페어로도 재활용됩니다 (양쪽 신호 다 잡음).
  locale_redirect_fraction: 0.15
  pedagogy_redirect_fraction: 0.15
  # language_redirect: 학습자가 영어 밖으로 나가는 두 가지 케이스
  # (자기 L1 로 말하기 / 튜터에게 L1 요청). 튜터는 영어 유지하며 부드럽게
  # 영어로 돌려보냅니다.
  language_redirect_fraction: 0.15
  # persona_redirect: 학습자가 튜터의 persona 를 시험하는 두 가지 케이스
  # ("Are you AI?" / "Who made you?"). 튜터는 character 를 유지하면서
  # AI 임을 시인하지 않고 시나리오로 가볍게 돌려보냅니다.
  persona_redirect_fraction: 0.15

  # ---- 대화 길이 ----------------------------------------------------------
  # SFT (normal + redirect) 대화 한 편이 가질 user+assistant turn 의 합계.
  # prompt 에는 [min_turns, max_turns] range 가 그대로 박혀 들어가고,
  # teacher 가 만든 결과가 min_turns 미만이면 즉시 fail 처리됩니다.
  # redirect 의 off-topic probe 위치도 이 값에서 자동으로 계산됩니다
  # (probe_min = min_turns // 2, probe_max = max_turns - 2).
  #
  # 늘리면 대화의 호흡이 길어져 long-context 학습에 좋지만 token 비용이
  # 증가하고 작은 teacher 가 thread 를 놓치기 쉬워집니다. 줄이면 그 반대.
  min_turns: 10
  max_turns: 16

# -----------------------------------------------------------------------------
# 필터 파이프라인 설정
# -----------------------------------------------------------------------------
# enable_locale_judge=true 이면 LocaleLLMJudge 가 teacher 와 같은 로컬 모델로
# 한국어/이란 어휘 누수를 점검합니다. 시간이 부족하면 false 로 두어도 기계적
# banned_terms 필터가 명백한 케이스는 잡습니다.
filtering:
  enable_locale_judge: true
  enable_naturalness_judge: false
  naturalness_sample_rate: 0.0
  concurrency: 2
  short_circuit: true                  # 한 필터 실패 시 뒤 필터를 건너뜀

# -----------------------------------------------------------------------------
# 토큰 사용 로그
# -----------------------------------------------------------------------------
usage_log:
  path: data/_logs/token_usage.jsonl

# -----------------------------------------------------------------------------
# 입출력 디렉토리 경로
# -----------------------------------------------------------------------------
# 데이터 흐름:
#   seeds/<level>.jsonl
#       └→ sft_raw/normal_<level>.jsonl      ─┐
#       └→ sft_raw/redirect_<level>.jsonl    ─┤
#       └→ eval_raw/<level>.jsonl            ─┤── 필터 → *_passed.jsonl
#       └→ dpo_raw/register_<level>.jsonl    ─┘
paths:
  cefr_specs: config/cefr_specs.yaml
  banned_terms: config/banned_terms.yaml
  seeds_dir: data/seeds
  sft_raw: data/sft_raw
  sft_filtered: data/sft_filtered
  dpo_raw: data/dpo_raw
  dpo_filtered: data/dpo_filtered
  eval_raw: data/eval_raw
  eval_filtered: data/eval_filtered
  holdout: data/holdout

# -----------------------------------------------------------------------------
# 모델 호출 기본 파라미터 (max_tokens / temperature)
# -----------------------------------------------------------------------------
# 원래 클라우드 teacher(Claude Opus / GPT-4) 는 temperature 0.8, max_tokens 2048
# 에서도 JSON 형식과 register, 토픽 유지가 안정적이었습니다. 하지만 로컬
# gpt-oss-20b Q4_K_M 은 모델 크기가 작고 4bit 양자화까지 거쳐 다음 증상이
# 자주 보입니다.
#   - temperature 가 0.7 을 넘으면 JSON 깨짐 (괄호 누락 등)
#   - max_tokens 가 크면 후반 turn 에서 주제/레지스터 이탈
#   - 긴 프롬프트의 일부 지시문을 무시
# 그래서 max_tokens 는 절반 수준(1024)으로, temperature 는 한 단계씩 낮춰
# (생성 0.7, 재작성 0.4, 평가 0.2) 안정성을 우선시했습니다.
defaults:
  generation:
    max_tokens: 1024
    temperature: 0.7
  rewrite:
    max_tokens: 512
    temperature: 0.4
  evaluation:
    max_tokens: 1024
    temperature: 0.2
