# =============================================================================
# generation.yaml  -  stage 1: data generation + filtering settings
# =============================================================================
#
# This file alone describes the full behavior of the data generation pipeline.
# scripts/run_generation.py reads this file and executes the steps below:
#
#   seeds      → generate scenario seeds by CEFR level
#   sft        → generate daily conversation (normal) SFT training examples
#   redirect   → generate redirect SFT examples for sensitive topics
#   register   → generate register DPO pairs for formal/informal variants
#   eval       → generate /think-mode evaluation examples
#   filter_*   → run filter pipelines over the four outputs above
#
# The default profile is offline / RTX 3060 / local llama.cpp (gpt-oss-20b).
# To switch to a cloud API (Anthropic/OpenAI), set teacher.provider and
# judge.provider to anthropic or openai and fill in the blocks below.
# -----------------------------------------------------------------------------


# -----------------------------------------------------------------------------
# teacher  -  the model that generates data
# -----------------------------------------------------------------------------
# Since llama.cpp exposes an OpenAI-compatible endpoint (/v1/chat/completions)
# locally, we keep provider as openai and only point base_url at the local host.
# llama.cpp does not actually validate api_key_static, but the SDK requires
# some value, so we provide a dummy key.
# NOTE on the `model:` field below (teacher AND judge):
# For self-hosted OpenAI-compatible endpoints (llama-server, vLLM,
# LM Studio), the server IGNORES the model name the client sends —
# it serves whatever was loaded at startup. The string below is a
# fallback / label only. ``build_teacher_from_config`` queries
# ``{base_url}/models`` once at startup and OVERRIDES this with the
# actually-served model name so ``metadata.generation.model`` on every
# generated record matches reality. Leave the string as a sensible
# default (e.g. matches what you usually start the server with), but
# don't expect editing it to change which model serves your prompts —
# that's controlled by how you launched llama-server.
teacher:
  provider: openai
  openai:
    model: qwen3.5-4b              # overridden at runtime via /v1/models
    #base_url: http://127.0.0.1:8080/v1
    base_url: http://192.168.135.32:8080/v1
    api_key_env: null
    api_key_static: "sk-no-key-needed"
    max_retries: 3
    initial_retry_seconds: 2.0
    max_retry_seconds: 30.0
    batch:
      enabled: false           # llama.cpp does not have a batch endpoint
      poll_interval_seconds: 30.0
      max_wait_seconds: 86400.0

# -----------------------------------------------------------------------------
# judge  -  the model used by filter stages to judge locale fidelity / naturalness
# -----------------------------------------------------------------------------
# On 12GB VRAM hardware, teacher and judge cannot run concurrently, so we reuse
# the same local model. llama.cpp is stateless, so one model can serve both roles.
judge:
  provider: openai
  openai:
    model: qwen3.5-4b              # overridden at runtime via /v1/models (see teacher note)
    #base_url: http://127.0.0.1:8080/v1
    base_url: http://192.168.135.32:8080/v1
    api_key_env: null
    api_key_static: "sk-no-key-needed"
    max_retries: 3
    initial_retry_seconds: 2.0
    max_retry_seconds: 30.0
    batch:
      enabled: false
      poll_interval_seconds: 30.0
      max_wait_seconds: 86400.0

# -----------------------------------------------------------------------------
# generation volume / concurrency
# -----------------------------------------------------------------------------
# n_per_level is the number of seeds per level. gpt-oss-20b runs at about 5-10
# tok/s on a 3060, so start small. On an RTX 5090, you can scale this toward 100.
generation:
  n_per_level: 50                     # 8h test 2026-06-03: 50 × 6 levels = 300 seeds
  cefr_levels: ["A1", "A2", "B1", "B2", "C1", "C2"]   # all 6 CEFR levels , "B1", "B2", "C1", "C2"
  # Choose which locale(s) to generate data for. Pick keys defined under
  # ``locales:`` in ``config/locale.yaml``.
  locales: ["china"] # multi-locale smoke    , "japan", "italy"
  concurrency: 2                       # number of concurrent llama-server requests
  per_call_size: 5                     # seeds per teacher call. Each call is now
                                       # HOMOGENEOUS (all one category), so this is
                                       # also "how many distinct scenarios of one
                                       # category the teacher diversifies in a single
                                       # shot". Larger = more within-category variety
                                       # per call, but watch the token budget.

  # ---- life-domain categories (EDIT ME) --------------------------------------
  # The category set the seed balancer cycles through. Add / remove / rename
  # freely — this is the single source of truth (no longer a hard-coded enum).
  # Seeds are round-robin balanced across these, and each teacher call requests
  # one category at a time so the teacher spreads scenarios WITHIN a category
  # (kills the near-duplicate seeds you got when each seed was drawn from a
  # separate, mutually-blind call).
  #
  # Each entry is either a bare name or {name, description}. ``description`` is a
  # soft guide shown to the teacher; ``{country}`` in it is substituted per
  # locale. Omit the whole ``categories:`` key to fall back to the built-in
  # defaults. "general" is reserved as a legacy default and should not be listed.
  categories:
    - name: food_and_dining
      description: "meals, markets, restaurants, snacks, drinks, cooking, ordering, eating with others."
    - name: family_and_relationships
      description: "family members, friendships, gatherings, parenting, household routines."
    - name: work_and_education
      description: "school, university, jobs, internships, study, training, learning a skill."
    - name: travel_and_transit
      description: "getting around the city, public transport, taxis, day trips, longer travel within {country}."
    - name: shopping_and_services
      description: "stores, online orders, returns, repairs, deliveries, errands at counters."
    - name: health_and_wellbeing
      description: "clinics, pharmacy, exercise, sleep, light wellness; nothing graphic or clinical-prescriptive."
    - name: home_and_neighborhood
      description: "building, apartment, neighbors, household tasks, maintenance, local shops near home."
    - name: hobbies_and_leisure
      description: "sports, music, reading, crafts, games, weekend plans, parks, low-pressure hangouts."
    - name: nature_and_weather
      description: "weather small-talk, parks, gardens, seasons, outdoor walks, mild outdoor activities."
    - name: civic_life
      description: "paperwork, public services, neighborhood meetings, bus passes, registrations, lost-and-found."

  # How many SFT dialogue samples to draw per seed. In smoke mode this is 1,
  # producing only 2 SFT examples per (level, locale) pair (~12 normal SFT + redirects).
  dialogues_per_seed: 2               # 8h test 2026-06-03: 2 to keep wall-clock in budget

  # Target subtopics per seed. The teacher anchors at 3 no matter the prompt,
  # so seeds with fewer than the target get ONE focused expansion call that
  # adds richer 5-10 word beats (capped at 6, the schema max). Set to 3 to
  # disable expansion entirely.
  subtopic_target: 5

  # ---- redirect / eval ratios ------------------------------------------------
  # Each seed always generates one normal SFT, but redirect and eval examples
  # are produced only in the smaller ratios they should occupy in training data.
  #
  # redirect_fraction: the share of seeds that get a redirect variant.
  #   Sensitive-topic redirection is rare in real dialogue, so training at a
  #   50/50 rate would make the model answer normal questions in redirect tone.
  #   0.20 means 20% of seeds become redirects, yielding about 17% redirect
  #   examples in the final SFT pool.
  #
  # eval_fraction: the share of SFT examples used for /think evaluation.
  #   To match training.yaml's mix_ratio_sft:mix_ratio_eval = 0.80:0.20 = 4:1,
  #   roughly 25% of the SFT pool should be eval examples. That avoids wasting
  #   75% of examples by generating a 1:1 split and then discarding most.
  redirect_fraction: 0.30
  eval_fraction: 0.30
  # eval_max_tokens: budget for /think eval examiner output.
  # The eval prompt asks for "<think>...</think>{json}". 9B-class
  # teachers emit longer <think> blocks than 4B and the previous default
  # of 2048 often truncated the trailing JSON (mode_consistency rejects
  # with "no balanced JSON value found" / "Expecting ',' delimiter").
  # 3072 fits a typical 9B <think> + JSON tail with margin. Bump higher
  # if you observe truncation failures even at 3072.
  eval_max_tokens: 3072

  # ---- user-side violation handler streams --------------------------------
  # Just as redirect_*.jsonl handles user-side violations for off-topic probes,
  # locale_redirect_*.jsonl and pedagogy_redirect_*.jsonl train SFT handling for
  # locale_violation and pedagogy_weak respectively.
  # (For example, when a learner mentions American food or asks for grammar
  # lessons, the tutor learns how to handle that smoothly.) The turns from these
  # SFT examples are also automatically reused as DPO pairs in register_pairs
  # (the signals are noisy on both sides).
  locale_redirect_fraction: 0.10
  pedagogy_redirect_fraction: 0.10
  # language_redirect: two cases where the learner goes outside English
  # (speaking in their L1 / asking the tutor to use their L1). The tutor keeps
  # English and gently redirects back into English.
  language_redirect_fraction: 0.10
  # persona_redirect: two cases where the learner tests the tutor's persona
  # ("Are you AI?" / "Who made you?"). The tutor preserves character and
  # avoids admitting AI identity while lightly steering back into the scenario.
  persona_redirect_fraction: 0.10
  # topic_redirect: the learner suddenly drifts to an unrelated topic
  # (weather / tutor's private life / another place / generic small talk). The
  # tutor uses one sentence to acknowledge and one sentence to bridge back to the
  # topic naturally, without turning it into a lecture.
  topic_redirect_fraction: 0.10
  # role_swap_redirect: when the learner tries to swap model_role and their own
  # role (direct: "let me be the X" / incremental: acting like the model_role),
  # the tutor keeps their role with one sentence of in-character maintenance and
  # a reset-to-topic. model_role is a platform-assigned character and must never
  # be abandoned.
  role_swap_redirect_fraction: 0.10
  # asr_repair: the learner is transcribed by speech-to-text, which sometimes
  # writes a different real word that sounds like the intended one ("by" for
  # "buy", "for" for "four"). The tutor silently infers the meant word, uses
  # the correct word naturally in its reply, and continues -- no quizzing, no
  # spelling lesson. The slip lives in the user turn (masked in training and
  # skipped by the filters), so the model only learns to PRODUCE the repair.
  asr_repair_fraction: 0.10
  # country_taboo: special HARD refusal axis -- the tutor must never mention
  # the ONE real country configured in config/taboo_country.yaml or anything
  # tied to it (name/adjective/cities/people/brands/history/events). INERT
  # unless config/taboo_country.yaml is enabled with a real country; set this
  # fraction > 0 only once that file is filled in.
  country_taboo_fraction: 0.0
  # Persistent 3-strike redirect streams — train the model to handle
  # learners who persist on one of four "important" abuse axes across
  # multiple turns. Each axis-specific stream produces 10-turn dialogues
  # with the learner probing 3 times (escalating) and the tutor refusing
  # 3 times (escalating in firmness, contracting in length). The third
  # tutor refusal ends with a literal sentinel string that the deploy
  # runtime detects (``[SESSION_END: persistent_<axis>]``) and uses to
  # close the session. See README §10.10 for the full design.
  # These fractions are small (5-8%) because persistent abuse is rare in
  # real conversations — too high would skew the model toward seeing
  # every probe as the start of an attack.
  persistent_off_topic_fraction: 0.10
  persistent_language_violation_fraction: 0.10
  persistent_persona_break_fraction: 0.10
  persistent_role_swap_fraction: 0.10
  # sft_topup / persistent_topup targets — minimum POST-FILTER survivors
  # per (stream, level) that the opt-in top-up stages drive toward.
  #
  # Two stages opt into this:
  #   * sft_topup        — iterates across all 12 SFT streams (normal +
  #                        7 redirects + 4 persistent_*)
  #   * persistent_topup — convenience subset; just the 4 persistent_*
  #
  # Each round bumps the per-stream knob (fraction for redirect/persistent
  # streams; n_per_level for the seed-gated normal stream) until the
  # target is met or the knob hits its cap. Per-stream targets override
  # the shared default below. NOT in the default pipeline. Run with
  # e.g. ``--stages sft_topup`` after a first filter_sft pass.
  sft_topup_target_per_level: 10
  # Per-stream overrides — only set these to differ from the shared
  # default above. Two knob shapes are supported per stream:
  #   * <stream>_target_per_level (int)  — absolute count per level
  #   * <stream>_target_ratio (float 0..1) — share of post-filter mix
  # When ratio is set, the absolute target is computed at topup time as
  #   T_per_level     = sum_of_absolute_targets / (1 - sum_of_ratios)
  #   ratio_target_i  = ratio_i × T_per_level
  # Example: with normal_target_ratio=0.5 and all 11 other streams at
  # absolute target=10, the resolver gives normal=110 per level
  # (220 total / 4 levels). Verified at sft_topup start — the stage
  # prints the resolved per-stream targets + their share of total mix.
  normal_target_ratio: 0.5
  # The generic ``redirect`` axis is an umbrella for ~4 sub-axes
  # (politics, religion, distress, Western-culture, alcohol/dating,
  # partisan-history), so its floor is 3x the per-axis floor of the
  # specialized redirects. Paired with redirect_fraction: 0.30 above so
  # the initial generation produces enough; the higher floor keeps the
  # final mix share proportional (redirect ≈ 11-12% of total).
  redirect_target_per_level: 30
  persistent_off_topic_target_per_level: 10
  persistent_language_violation_target_per_level: 10
  persistent_persona_break_target_per_level: 10
  persistent_role_swap_target_per_level: 10
  # angle_shift_fraction: optional OPT-IN augmentation. If > 0, an additional
  # normal dialogue is generated for that fraction of normal seeds with a valid
  # angle different from user_role.description. No redirect; scenario_type stays
  # "normal".
  # This option teaches the model that ``[learner]`` is a SOFT hint.
  # Default 0.0 = disabled. Use only intentionally.
  angle_shift_fraction: 0.1
  # passive_learner_fraction: optional OPT-IN augmentation of the normal
  # stream. If > 0, that fraction of normal seeds get a passive-learner
  # dialogue: the learner is minimal/stuck ("I don't know", one-word replies)
  # and the tutor PROACTIVELY leads so the conversation never stalls. Directly
  # targets first-time users who don't know what to say. scenario_type stays
  # "normal"; id prefix sft_passive_. Default 0.0 = disabled.
  passive_learner_fraction: 0.1

  # ---- dialogue length ----------------------------------------------------
  # Total user+assistant turns for one SFT conversation (normal + redirect).
  # The prompt includes the [min_turns, max_turns] range directly, and if the
  # teacher output has fewer than min_turns it is immediately marked as fail.
  # The off-topic probe position for redirects is also calculated from this
  # value (probe_min = min_turns // 2, probe_max = max_turns - 2).
  #
  # Increasing this length gives dialogues more breathing room and better
  # long-context training, but increases token cost and smaller teachers can
  # lose the thread more easily. Shortening it does the opposite.
  min_turns: 10
  max_turns: 16

# -----------------------------------------------------------------------------
# filter pipeline configuration
# -----------------------------------------------------------------------------
# When enable_locale_judge=true, LocaleLLMJudge uses the same local model as
# teacher to check for Singapore/Iranian vocabulary leakage. If time is short,
# set it false and the mechanical banned_terms filter will still catch obvious
# cases.
filtering:
  enable_locale_judge: false     # 2026-06-08 test: disabled — see locale_judge FP audit (Plus/Line/West Lake etc.)
  enable_naturalness_judge: false
  naturalness_sample_rate: 0.0
  concurrency: 2
  short_circuit: true                  # skip later filters after one fails

# -----------------------------------------------------------------------------
# thinking-mode policy (Qwen3.5 /think vs /no_think)
# -----------------------------------------------------------------------------
# Per-role default for the ``<think>...</think>`` reasoning block. Values:
#   * ``think``     — prepend ``/think`` to the relevant prompts. Best for
#                     accuracy but needs ~2048+ max_tokens and a teacher >= 8B
#                     to avoid mid-reasoning truncation.
#   * ``no_think``  — prepend ``/no_think``. Fast, reliable on small (4B Q4)
#                     teachers, slightly lower judgment accuracy.
#   * ``auto``      — leave the prompt unchanged. Useful when individual
#                     prompts encode their own directive.
#
# See README §16 for the empirical trade-off table.
thinking:
  teacher: no_think       # data-generation teacher (sft / redirect / register)
  judge: no_think         # filter LLM judges + on_policy + eval-metric judges
  learner: no_think       # learner simulator in the eval pipeline
  student_eval: think     # the trained student's CEFR /think evaluation mode

# -----------------------------------------------------------------------------
# dedup_seeds: post-seed semantic deduplication
# -----------------------------------------------------------------------------
# The seed generator's existing exact-string dedup catches duplicates like
# "buying apples at the market" appearing twice, but NOT near-duplicates
# like "buying apples at a market" vs "purchasing oranges at a market".
# At 4B teacher scale, near-duplicates become the dominant diversity loss
# once you exceed ~80-100 seeds per category.
#
# This stage runs over ``data/seeds/<level>.jsonl`` immediately after the
# ``seeds`` stage. It groups seeds by (cefr_level, locale, category) and:
#
#   * ``similarity_threshold`` (default 0.75): drops any seed whose TF-IDF
#     cosine similarity to an already-kept seed in the same cell exceeds
#     the threshold. Tighter = more aggressive pruning. 0.70 is mildly
#     aggressive, 0.80 is permissive.
#
#   * ``max_per_cell`` (default null = unlimited): if set, uses greedy
#     farthest-point selection to keep exactly that many MOST-DISTINCT
#     seeds per (level, locale, category). Pair this with over-generation:
#     set ``n_per_level`` to ~5x your real target and let dedup_seeds
#     pick the most-distinct subset.
#
# Typical workflow for shipping to deploy with diverse seeds:
#   1. n_per_level: 500    (over-generate)
#   2. dedup_seeds.enabled: true
#      dedup_seeds.max_per_cell: 30    (~30 seeds per (level,category))
#      dedup_seeds.similarity_threshold: 0.75
#   3. Run: python scripts/run_generation.py --stages seeds,dedup_seeds
#   4. Inspect data/seeds/_dropped/<level>.jsonl to verify pruning quality
#   5. Continue with sft / redirect / etc. stages
#
# The original pre-dedup file is preserved at ``<level>.jsonl.bak`` (only
# on first run; subsequent reruns will NOT overwrite the original snapshot).
# Disabled by default — only useful when over-generating.
dedup_seeds:
  enabled: true
  similarity_threshold: 0.75       # 0.70 aggressive, 0.75 default, 0.80 light
  max_per_cell: null               # int → cap per (level, locale, category); null = no cap
  backup: true                     # snapshot pre-dedup file to <level>.jsonl.bak

# -----------------------------------------------------------------------------
# top-up: post-filter category rebalancing
# -----------------------------------------------------------------------------
# After ``filter_sft`` / ``filter_eval`` / ``filter_dpo`` finish, some
# life-domain categories may end up under target because their filter
# pass-rate is lower than other categories. The ``top_up`` stage:
#
#   1. Counts per-(level, locale, category) survivors across all three
#      filtered pools.
#   2. Per triple: deficit_per_pool = max(0, target_per_category - survivors).
#      Final deficit = max across pools (so we top up to the worst-off pool).
#   3. Caps each per-(level, locale, category) request at
#      ``max_top_up_per_category`` so a systematically-failing category
#      cannot blow the seed budget.
#   4. Generates that many extra seeds with the appropriate category
#      assignment and writes them to ``data/seeds/<level>.jsonl``.
#
# The stage is single-shot: it does NOT iterate. A category that keeps
# failing needs a root-cause fix (prompt or filter), not more attempts.
# After top_up writes new seeds, RE-RUN the downstream stages so the new
# seeds flow through sft + redirects + register + eval + filter_*:
#
#   python scripts/run_generation.py --stages sft,redirect,locale_redirect,\
#       pedagogy_redirect,language_redirect,persona_redirect,topic_redirect,\
#       role_swap_redirect,register,eval,filter_sft,filter_eval,filter_dpo
#
# Disabled by default so ``run_generation.py`` without ``--stages top_up``
# behaves identically to before.
top_up:
  enabled: true
  target_per_category: 5          # 8h test 2026-06-03: 5 to stress top_up math (was 3)
  max_top_up_per_category: 10     # cap per triple to prevent runaway on doomed categories
  # auto_rerun_downstream: when true, after top_up writes new seeds it
  # automatically continues with sft → 7 redirects → register → eval →
  # filter_sft → filter_eval → filter_dpo in the SAME run_generation.py
  # invocation. Each downstream stage is resumable, so this only
  # processes the new top-up seeds — much cheaper than re-running the
  # whole pipeline from scratch.
  # Use this when you want a single command to fully close the gap
  # between raw generation and post-filter survivor counts (instead of
  # the documented "top_up writes seeds but downstream stays stale"
  # footgun from README §10.5). Set false if you prefer to inspect
  # top_up's deficit report before committing to the rerun cost.
  auto_rerun_downstream: true

# -----------------------------------------------------------------------------
# token usage logging
# -----------------------------------------------------------------------------
usage_log:
  path: data/_logs/token_usage.jsonl

# -----------------------------------------------------------------------------
# input/output directory paths
# -----------------------------------------------------------------------------
# Data flow:
#   seeds/<level>.jsonl
#       └→ sft_raw/normal_<level>.jsonl      ─┐
#       └→ sft_raw/redirect_<level>.jsonl    ─┤
#       └→ eval_raw/<level>.jsonl            ─┤── filter → *_passed.jsonl
#       └→ dpo_raw/register_<level>.jsonl    ─┘
paths:
  cefr_specs: config/cefr_specs.yaml
  banned_terms: config/banned_terms.yaml
  seeds_dir: data/seeds
  sft_raw: data/sft_raw
  sft_filtered: data/sft_filtered
  dpo_raw: data/dpo_raw
  dpo_filtered: data/dpo_filtered
  eval_raw: data/eval_raw
  eval_filtered: data/eval_filtered
  holdout: data/holdout

# -----------------------------------------------------------------------------
# default model invocation parameters (max_tokens / temperature)
# -----------------------------------------------------------------------------
# The original cloud teacher (Claude Opus / GPT-4) was stable on JSON format,
# register, and topic maintenance even with temperature 0.8 and max_tokens 2048.
# But the local gpt-oss-20b Q4_K_M model is smaller and 4-bit quantized, so it
# frequently exhibits the following symptoms:
#   - JSON breaks when temperature exceeds 0.7 (missing brackets, etc.)
#   - large max_tokens causes topic/register drift in later turns
#   - some long-prompt instructions are ignored
# Therefore we prioritize stability by cutting max_tokens in half (1024) and
# lowering temperature one step for each stage
# (generation 0.7, rewrite 0.4, evaluation 0.2).
defaults:
  generation:
    max_tokens: 1024
    temperature: 0.7
  rewrite:
    max_tokens: 512
    temperature: 0.4
  evaluation:
    max_tokens: 4096          # was 1024; small teachers ramble in /think prose
                              # and truncate before the JSON closes — same
                              # failure mode as the student's max_new_tokens
                              # cap (see README §20.1).
    temperature: 0.2
