# =============================================================================
# paper/training_a4_no_persistent.yaml  -  Condition A4
# =============================================================================
#
# Condition: full system MINUS the 4 persistent 3-strike streams.
# Tests whether the persistent 4-variant structural design matters: does
# removing it cause the model to miss multi-turn adversarial persistence?
#
# Training streams: normal + generic redirect + 6 specialized redirects
# Dropped streams:  persistent_off_topic, persistent_language_violation,
#                   persistent_persona_break, persistent_role_swap
#
# Pre-req: run `python scripts/setup_paper_ablation_data.py --conditions a4`
# to materialize data/sft_filtered_a4/ before launching training.
# -----------------------------------------------------------------------------

base_model:
  model_id: "./vendor/models/Qwen_3.5_0.8B-Base"
  tokenizer_id: "./vendor/models/Qwen_3.5_0.8B-Base"
  trust_remote_code: true
  attn_implementation: "sdpa"
  torch_dtype: "bfloat16"
  quantization:
    enabled: true
    load_in_4bit: true
    bnb_4bit_quant_type: "nf4"
    bnb_4bit_compute_dtype: "bfloat16"
    bnb_4bit_use_double_quant: true
  gradient_checkpointing: true

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

sft:
  output_dir: "outputs/paper/a4/sft"
  num_train_epochs: 2
  max_steps: -1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  weight_decay: 0.01
  max_seq_length: 1792  # see training_a1_full.yaml — 1792 gives headroom on 12GB
  packing: false
  bf16: true
  fp16: false
  optim: "paged_adamw_8bit"
  logging_steps: 5
  eval_strategy: "no"
  save_strategy: "no"
  save_total_limit: 1
  load_best_model_at_end: false
  report_to: "none"
  seed: 42
  data:
    sft_filtered_dir: "data/sft_filtered_a4"
    eval_filtered_dir: "data/eval_filtered"
    holdout_dir: "data/holdout"
    mix_ratio_sft: 0.80
    mix_ratio_eval: 0.20
    use_all_data: true
    validation_split: 0.05
    shuffle_seed: 42

dpo:
  output_dir: "outputs/paper/a4/dpo"
  num_train_epochs: 1
  max_steps: -1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 5.0e-6
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  weight_decay: 0.0
  beta: 0.1
  loss_type: "sigmoid"
  max_length: 2400
  max_prompt_length: 1500
  bf16: true
  fp16: false
  optim: "paged_adamw_8bit"
  logging_steps: 5
  eval_strategy: "no"
  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 3
  report_to: "none"
  seed: 42
  sft_adapter_path: "outputs/paper/a4/sft"
  ref_model: null
  data:
    dpo_filtered_dir: "data/dpo_filtered"
    validation_split: 0.05
    shuffle_seed: 42
    mix_ratio_register: 0.70
    mix_ratio_on_policy: 0.30
    use_all_data: true

on_policy:
  enabled: true
  adapter_path: "outputs/paper/a4/sft"
  max_per_level: 100  # see a1 config for rationale
  min_margin: 2
  concurrency: 2
  target_max_tokens: 320
  target_temperature: 0.7

logging:
  wandb_project: "qwen-en-tutor"
  wandb_entity: null
  wandb_run_name_prefix: "paper-a4-no-persistent"

eval_callback:
  enabled: false
  n_conversation_samples: 10
  n_evaluation_samples: 10
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.95
  log_samples_table: true
  conversation_filters:
    - banned_terms
    - mode_consistency
    - naturalness
  held_out_prompts_path: "data/holdout/eval_callback_prompts.jsonl"

evaluation:
  holdout_dir: data/holdout
  n_per_level: 3
  concurrency: 2
  intermediate_adapter_path: outputs/paper/a4/sft
  final_adapter_path: outputs/paper/a4/dpo

comparison:
  threshold: 0.05
  fail_on_regression: false

gguf_export:
  adapter_path: "outputs/paper/a4/dpo"
  merged_dir: "outputs/paper/a4/merged"
  keep_merged: false
  output_dir: "outputs/paper/a4/gguf"
  model_name: "paper-a4"
  outtype: "bf16"
  quantize: "Q4_K_M"
  llama_cpp_repo: "vendor/llama_cpp_src"
  llama_quantize_bin: "vendor/llama_cpp/llama-quantize.exe"
