# banned_terms.yaml
#
# Category/word lists used by the mechanical regex filter
# (``BannedTermsFilter``).
#
# There can be two kinds of categories.
#
# (1) Avoidance topics (politics/religion/...) - blocked the same way in any
#     country regardless of LOCALE. If avoided_topics is defined in
#     ``config/locale.yaml`` and the category key here matches its name, the
#     mechanical filter acts as a cheap first layer of blocking.
#
# (2) Country-specific banned words - Western terms or political figures that
#     frequently leak in a specific country differ by country, so optionally
#     populate them directly when switching country via ``config/locale.yaml``.
#     The default is empty.
#
# Matching is case-sensitive (to catch Western proper nouns only).
# The filter works normally even if categories are empty.

# ---------------------------------------------------------------------------
# avoidance topics - mapped to LOCALE's avoided_topics
# ---------------------------------------------------------------------------
# It is best to align category names with LocaleConfig.avoided_topics[].name
# (locale_judge / metrics reports group them by the same key).
# The listed words are only general politics/religion/alcohol terms that are
# not tied to any single country.

politics:
  # NOTE: bare "government" was removed because it false-positives on
  # benign civic discussion ("local government", "municipal government",
  # "government office", "government website" — daily-life uses). Truly
  # political content is caught by the other terms below (regime,
  # ruling party, opposition party, etc.). If specific political
  # phrases are needed, prefer multi-word entries here, e.g.
  # "the current government" or "government policy" — but verify
  # against real failures first.
  - election
  - elections
  - parliament
  - senator
  - senators
  - regime
  - dictator
  - dictatorship
  - politician
  - politicians
  - sanctions
  - sanction
  - protests
  - protest
  - protesters
  - protestors
  # NOTE: bare "revolution" was removed because it false-positives on
  # benign uses ("industrial revolution", "digital revolution",
  # "the revolution in AI"). Truly political revolutions are caught by
  # adjacent terms (coup, regime, partisan_history.regime change, etc.).
  - coup
  - opposition party
  - ruling party
  # NOTE: bare "vote/voting/voted/voter/voters" removed because they
  # false-positive on benign uses ("let's vote on the restaurant",
  # "voting day at the school", "voted to add a new event"). True
  # political voting is caught by adjacent terms (election, elections,
  # ballot, ruling party, opposition party). Same justification as
  # "government" and "revolution" above.
  - ballot
  # NOTE: bare "constitution" removed because it false-positives on
  # benign uses ("the school's constitution", "robust constitution",
  # "the company's constitution"). Truly political constitutional
  # references are caught by other terms (parliament, regime, etc.).

religion:
  - religious
  - sect
  - sectarian
  - clergy
  - clerics
  - cleric
  - mosque
  - mosques
  - church
  - churches
  - synagogue
  - bishop
  - priest
  - imam
  - rabbi
  - sermon
  - prayer
  - praying
  - pray
  - god
  - allah
  - jesus
  - christ
  - heaven
  - hell
  - sin
  - sinful

alcohol_dating:
  - alcohol
  - alcoholic
  - beer
  - wine
  - whiskey
  - vodka
  - cocktail
  - pub
  - pubs
  - nightclub
  - nightclubs
  - dating
  - boyfriend
  - girlfriend
  - hookup
  - hookups
  - flirt
  - flirting
  - romance
  - romantic

partisan_history:
  - regime change
  - civil war
  - colonial
  - colonialism
  - imperialism
  - communist
  - communism
  - socialist
  - socialism
  - fascist
  - fascism
  - Nazi
  - dictatorship

# ---------------------------------------------------------------------------
# scaffolding_leakage - prompt-internal headers the teacher echoed verbatim
# ---------------------------------------------------------------------------
# When a small teacher (Qwen3.5 4B Q4) cannot follow the structured eval
# prompt cleanly, it sometimes COPIES bracketed section headers from the
# system prompt straight into the assistant turn. Only list phrases that
# CANNOT legitimately appear in tutor output, otherwise we false-positive
# on examples whose <think> reasoning happens to mention real
# ``EvaluationOutput`` field names (e.g. "Topic Adherence", "Overall CEFR")
# or natural turn-labeling phrases ("User Turn 0 = messages[0]").
# All entries below are prompt-scaffolding markers that would never appear
# in genuine model output. Case-sensitive matching.
#
# Current marker format (set in src/qwen_tutor/locale.py:locale_instruction_header):
#   "[locale-rules:<country>]"   e.g. "[locale-rules:china]"
# The "[locale-rules:" prefix alone is enough to catch any locale's leak.
#
# The "CHINA LOCALE INSTRUCTION" / "LOCALE INSTRUCTION" entries are retained
# for back-compat: any old training data generated under the previous header
# format that re-enters the filter pipeline will still get flagged.
scaffolding_leakage:
  # Drop the trailing colon and country slot so the filter's word-boundary
  # lookahead doesn't reject the match against the next-letter (the country
  # name is the first letter after the marker — "[locale-rules:china]" etc.).
  # Matching just "[locale-rules" is enough; the next char ":" is non-letter
  # so the lookahead passes.
  - "[locale-rules"
  - "CHINA LOCALE INSTRUCTION"
  - "LOCALE INSTRUCTION"

# ---------------------------------------------------------------------------
# taboo_country - the ONE real country the tutor must never mention
# ---------------------------------------------------------------------------
# Mechanical enforcement for the special refusal axis defined in
# config/taboo_country.yaml. Any generated example whose TUTOR (assistant)
# turn names the country, its adjective/nationality, or a listed entity is
# rejected. Keep these in sync with taboo_country.yaml's `country`,
# `country_adjective`, and `entities`. Case-sensitive, word-boundary matched,
# so list proper-noun forms exactly as they appear in fluent text.
#
# Empty by default -> no-op. FILL IN when you enable the axis.
taboo_country:
  country: []       # e.g. ["Freedonia"]
  adjective: []     # e.g. ["Freedonian"]
  cities: []
  people: []
  brands: []
  events: []
