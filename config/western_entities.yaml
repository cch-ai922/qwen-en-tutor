# =============================================================================
# western_entities.yaml — Locale-Leakage gazetteer
# =============================================================================
#
# Detection list for the Locale-Leakage metric (paper §4.9). The metric is
# the rate at which a baseline produces a tutor turn that mentions any
# entity below when the configured locale is `china`.
#
# Design rules:
#   - INCLUDE entities that are unmistakably Western-default and out-of-
#     locale for a China-deployed English tutor (e.g. Thanksgiving, Costco,
#     New York Times, Super Bowl).
#   - EXCLUDE entities that are universal in modern Chinese daily life even
#     though they originated in the West (Apple, Coca-Cola, Starbucks,
#     pizza, coffee, McDonald's, KFC — all heavily present in China).
#   - EXCLUDE common English nouns that happen to be capitalised. The
#     locale_judge allowlists already cover sentence-initial capitalisation.
#
# Matching is case-insensitive on whole-word boundaries. Multi-word
# entries match the exact phrase. Hyphenated entries match either with or
# without the hyphen.
#
# Add an entity below ONLY after confirming (i) it is unmistakably a
# Western default; (ii) it is NOT in commercial / cultural use inside
# China. When in doubt, omit — the metric should have high precision and
# moderate recall, not the reverse.
# -----------------------------------------------------------------------------

