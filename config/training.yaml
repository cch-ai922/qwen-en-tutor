# =============================================================================
# training.yaml  -  stage 2: training + evaluation settings
# =============================================================================
#
# scripts/run_training.py reads this file and executes the following steps:
#
#   train_sft          → train SFT (LoRA)
#   eval_intermediate  → evaluate holdout with intermediate (=post-SFT) model
#   on_policy_gen      → collect additional DPO pairs with trained SFT adapter
#   filter_dpo         → filter additional DPO pairs + register pairs
#   train_dpo          → further train DPO on top of SFT
#   eval_final         → evaluate holdout with final (=post-DPO) model
#   compare            → write intermediate vs final metric comparison report
#
# Training consumes a lot of memory. It does not run on RTX 3060 (12GB); assume
# an RTX 5090 (32GB) or larger.
# -----------------------------------------------------------------------------


# -----------------------------------------------------------------------------
# base model + quantization settings
# -----------------------------------------------------------------------------
# A single student model is trained in two modes simultaneously:
#   - /no_think  : normal conversation responses (SFT data)
#   - /think     : CEFR evaluation (Evaluation data)
# The configuration is tuned to fit under 24GB with 4-bit NF4 quantization + LoRA.
#
# model_id can be either an HF Hub ID or a local path (folder). In offline
# environments, point it at a predownloaded folder under ``vendor/models/<name>``.
# For multimodal checkpoints (e.g. Qwen3-VL 4B = "Qwen3.5 4B"),
# ``src/qwen_tutor/training/model_loader.py`` reads config.json's architectures
# field and picks the correct auto-class automatically. Training data is text-only,
# so the vision tower is not used and LoRA is attached only to the language tower
# linear layers.
#
# To swap to another model, change only model_id + tokenizer_id.
#   Example: Qwen3-8B  →  vendor/models/Qwen3-8B  (text-only, trust_remote_code: false)
#            Qwen3-VL 4B →  vendor/models/Qwen_3.5_4B  (multimodal, trust_remote_code: true)
base_model:
  # model_id: "./vendor/models/Qwen_3.5_4B"
  # tokenizer_id: "./vendor/models/Qwen_3.5_4B"
  model_id: "./vendor/models/Qwen_3.5_0.8B"
  tokenizer_id: "./vendor/models/Qwen_3.5_0.8B"
  # For newer multimodal architectures like Qwen3-VL, transformers may need to
  # dynamically load internal code, so true is safer. If you use pure Qwen3-8B,
  # false is also acceptable.
  trust_remote_code: true
  # Qwen3-VL layer_types mix linear_attention and full_attention, so
  # flash_attention_2 may not work. Keep "sdpa" as the default and switch to
  # "flash_attention_2" only when using pure Qwen3-8B.
  attn_implementation: "sdpa"
  torch_dtype: "bfloat16"
  quantization:
    enabled: true                       # 0.8B fits in bf16; no 4-bit needed
    load_in_4bit: true
    bnb_4bit_quant_type: "nf4"
    bnb_4bit_compute_dtype: "bfloat16"
    bnb_4bit_use_double_quant: true
  gradient_checkpointing: true

# -----------------------------------------------------------------------------
# LoRA adapter settings
# -----------------------------------------------------------------------------
# r=32, alpha=64 is a good balance of expressiveness and memory for a model like Qwen3-8B.
# target_modules includes all linear layers in attention (q/k/v/o) and MLP (gate/up/down).
lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

# -----------------------------------------------------------------------------
# SFT training (train both conversation and evaluation modes together)
# -----------------------------------------------------------------------------
sft:
  output_dir: "outputs/sft"
  num_train_epochs: 2
  max_steps: -1                         # full epoch; smoke was 5
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  weight_decay: 0.01
  max_seq_length: 1024                  # smoke; 4096 for full
  packing: false
  bf16: true
  fp16: false
  optim: "paged_adamw_8bit"
  logging_steps: 1
  eval_strategy: "no"
  save_strategy: "no"
  save_total_limit: 1
  load_best_model_at_end: false
  report_to: "none"
  seed: 42

  # Training data mix - combine SFT 80% + Evaluation 20% so the single model
  # learns both modes.
  data:
    sft_filtered_dir: "data/sft_filtered"
    eval_filtered_dir: "data/eval_filtered"
    holdout_dir: "data/holdout"
    mix_ratio_sft: 0.80
    mix_ratio_eval: 0.20
    # use_all_data: when true (default), skip the ratio-based trim and
    # keep every loaded SFT and eval record (minus the per-bucket
    # validation hold-out). The natural on-disk ratio wins.
    # mix_ratio_sft / mix_ratio_eval are still required (sanity-checked,
    # must sum > 0) but have no size effect in this mode.
    # Set to false ONLY when both pools are healthy and you specifically
    # want to enforce mix_ratio_sft : mix_ratio_eval -- otherwise the
    # trimmer will throw away most of the larger pool to match a tiny
    # smaller pool. See README.
    use_all_data: true
    validation_split: 0.05               # 5% stratified validation
    shuffle_seed: 42

# -----------------------------------------------------------------------------
# DPO training (additional tuning with register preference + on-policy pairs)
# -----------------------------------------------------------------------------
# DPO starts from the SFT adapter. If ref_model is null, the frozen base model
# serves as the reference policy.
dpo:
  output_dir: "outputs/dpo"
  num_train_epochs: 1
  max_steps: -1                         # full epoch; smoke was 5
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 5.0e-6
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  weight_decay: 0.0
  beta: 0.1
  loss_type: "sigmoid"
  max_length: 1024                      # 3060 OOM at 2048; raise on bigger GPU
  max_prompt_length: 512
  bf16: true
  fp16: false
  optim: "paged_adamw_8bit"
  logging_steps: 1
  eval_strategy: "no"
  save_strategy: "no"
  save_total_limit: 1
  report_to: "none"
  seed: 42
  sft_adapter_path: "outputs/sft"
  ref_model: null

  data:
    dpo_filtered_dir: "data/dpo_filtered"
    validation_split: 0.05
    shuffle_seed: 42
    # DPO data is mixed from three sources:
    #   register   - register-unnatural / per-axis spoil pairs generated by
    #                offline rewrite (plentiful because they can be created
    #                immediately after SFT)
    #   on_policy  - trained SFT model output vs teacher output (filtered by
    #                judge margin, so smaller but precisely exposes current
    #                policy weakness)
    #   sentinel   - third-strike-turn pairs from the four persistent_*
    #                streams. chosen carries [SESSION_END: <axis>]; rejected
    #                does NOT. Source modes are interleaved in this pool:
    #                  * offline (Option A): rejected = chosen with the
    #                    marker stripped (zero teacher / policy calls).
    #                  * on_policy (Option B): rejected = SFT-student
    #                    regeneration of the sentinel-firing turn (no judge,
    #                    because marker presence is mechanical ground truth).
    #                Generated by src/qwen_tutor/generation/sentinel_pairs.py
    #                and written to data/dpo_raw/sentinel_<level>.jsonl.
    #                Solves the rare-token-cross-entropy gap that leaves SFT
    #                students unable to reliably emit [SESSION_END: ...] even
    #                when their refusal text is otherwise correct.
    # When pool sizes differ greatly, mix ratio trims the larger pools to
    # avoid them dominating the training batch. Training works normally
    # with only register even if on_policy and sentinel are empty.
    mix_ratio_register: 0.65
    mix_ratio_on_policy: 0.25
    mix_ratio_sentinel: 0.10
    # use_all_data: when true (default), skip the ratio-based trim and
    # keep every loaded register + on_policy + sentinel record.
    # mix_ratio_* are still required (sanity-checked, must sum > 0) but
    # have no size effect in this mode.
    # Set to false ONLY when all pools are healthy and you specifically
    # want to enforce the three-way ratio -- the sentinel pool is
    # naturally small (capped by the count of filtered persistent_*
    # records), so a low mix_ratio_sentinel keeps the trimmer from
    # cratering register/on_policy to match it.
    use_all_data: true

# -----------------------------------------------------------------------------
# wandb logging
# -----------------------------------------------------------------------------
logging:
  wandb_project: "qwen-en-tutor"
  wandb_entity: null                     # can also be set via the WANDB_ENTITY env var
  wandb_run_name_prefix: "qwen-en-tutor"

# -----------------------------------------------------------------------------
# in-training callback evaluation (TutorEvalCallback)
# -----------------------------------------------------------------------------
# Every eval_steps, sample directly from the model and measure pass rates for
# banned_terms / mode_consistency / naturalness filters, then log to wandb.
eval_callback:
  enabled: false                        # smoke: disabled to keep VRAM/time low
  n_conversation_samples: 10
  n_evaluation_samples: 10
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.95
  log_samples_table: true
  conversation_filters:
    - banned_terms
    - mode_consistency
    - naturalness
  held_out_prompts_path: "data/holdout/eval_callback_prompts.jsonl"

# -----------------------------------------------------------------------------
# post-training holdout evaluation (intermediate / final)
# -----------------------------------------------------------------------------
evaluation:
  holdout_dir: data/holdout
  n_per_level: 3                             # full test: 3 per level x 6 levels = 18
  concurrency: 2                             # 4B Q4 judge over LAN is bottleneck
  intermediate_adapter_path: outputs/sft     # intermediate model after SFT
  final_adapter_path: outputs/dpo            # final model after DPO

# -----------------------------------------------------------------------------
# comparison stage (intermediate vs final)
# -----------------------------------------------------------------------------
# If score drop exceeds threshold, it is considered regression. Set
# fail_on_regression=true to return a non-zero exit code on regression.
comparison:
  threshold: 0.05
  fail_on_regression: false

# -----------------------------------------------------------------------------
# on-policy DPO pair generation
# -----------------------------------------------------------------------------
# Regenerate one turn with the trained SFT model and compare it with teacher.
# If teacher is more natural, save the pair (policy_out, teacher_out) as
# (rejected, chosen). A larger min_margin selects only clearer quality differences.
on_policy:
  enabled: true
  adapter_path: outputs/sft
  max_per_level: 5                       # 8h test 2026-06-04: 5 to keep wall-clock (was 10)
  min_margin: 2                          # 1=slight, 2=clear, 3=large
  concurrency: 2                         # 4B Q4 over LAN is the bottleneck
  target_max_tokens: 320
  target_temperature: 0.7

# -----------------------------------------------------------------------------
# deployment-time / evaluation-time system prompts
# -----------------------------------------------------------------------------
# Single source of truth: both prompts come from
# ``src/qwen_tutor/generation/prompts.py``'s scenario-aware
# ``render_scenario_deployment_system_prompt`` and ``EVALUATION_SYSTEM_PROMPT``.
# They automatically reflect ``config/locale.yaml`` values for
# ``country`` / ``country_adjective`` / ``learner_description`` /
# ``avoid_default_cultures`` / ``avoided_topics``.
#
# To change prompt wording, edit prompts.py. To change locale-related values,
# edit locale.yaml. There are no prompts here anymore.

# -----------------------------------------------------------------------------
# GGUF export (offline llama-server deployment)
# -----------------------------------------------------------------------------
# scripts/run_gguf_export.py reads this block and:
#   1) merges the SFT/DPO adapter into the base with merge_lora()
#      (full-precision safetensors)
#   2) converts to GGUF with llama.cpp's convert_hf_to_gguf.py
#      (text tower; for Qwen3-VL it also generates mmproj-*.gguf)
#   3) optionally quantizes with llama-quantize (Q4_K_M, etc.)
# The resulting GGUF is written under output_dir and can be served directly
# with scripts/start_llama_cpp.ps1
# (`-ModelDir outputs/gguf -ModelGlob "*Q4_K_M*.gguf"`).
gguf_export:
  # Input: LoRA adapter to merge (SFT or DPO result)
  adapter_path: "outputs/dpo"
  # Intermediate outputs (merged safetensors). Deleted if keep_merged is false.
  merged_dir: "outputs/merged"
  keep_merged: false
  # GGUF output directory.
  output_dir: "outputs/gguf"
  # Model name prefix (used in filenames).
  model_name: "qwen-en-tutor"
  # Base dtype for conversion. "bf16" recommended; "f16" also possible.
  outtype: "bf16"
  # Quantization. "none" means only conversion is performed.
  # Recommended: for 4B models use Q4_K_M (speed/quality balance) or Q5_K_M (quality-first)
  quantize: "Q4_K_M"
  # Path to llama.cpp SOURCE checkout (convert_hf_to_gguf.py + gguf-py + conversion/).
  # vendor/llama_cpp is a prebuilt Windows release with only *.exe files and no
  # Python source, so it cannot be used for conversion. Clone source separately for
  # conversion:
  #   cd vendor && git clone https://github.com/ggerganov/llama.cpp llama_cpp_src
  llama_cpp_repo: "vendor/llama_cpp_src"
  # Path to llama-quantize executable. Usually found in prebuilt vendor/llama_cpp.
  # If null, PATH and $env:LLAMA_CPP_BIN are auto-detected.
  llama_quantize_bin: "vendor/llama_cpp/llama-quantize.exe"
