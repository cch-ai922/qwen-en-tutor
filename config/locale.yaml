# =============================================================================
# locale.yaml  -  target country definitions (multi-locale support)
# =============================================================================
#
# Changing only this file makes prompts / locale judge / metrics / banned-term
# filters follow the new country. No other code needs modification.
#
# Two modes are supported:
#
# 1) Single locale (traditional behavior): write country / country_adjective
#    directly at the top level. One model handles one country.
#
# 2) Multi-locale: place multiple country blocks under ``locales:`` and set
#    ``default_locale``. The model is trained to handle conversations for multiple
#    countries (one conversation = one country, and the caller indicates which
#    country to respond as via the system prompt at inference time).
#
# How it works: the teacher model is assumed to already know the country's
# cities/food/transport/currency/culture, so static lists (city names, foods,
# etc.) are not included. Providing only the country lets the teacher fill in
# the rest from its own knowledge.
# -----------------------------------------------------------------------------

# Default locale used in multi-locale mode. Ignored in single-locale mode.
default_locale: china

# -----------------------------------------------------------------------------
# multi-locale definitions
# -----------------------------------------------------------------------------
# Each entry key (china / japan / italy ...) identifies the locale and is used
# directly in the training data ``metadata.locale`` field. English snake_case is
# recommended. If you add a new locale, specifying only country and
# country_adjective is enough for the teacher model to fill in that country's
# cities/food/culture from its own knowledge.
#
# If you only need a single locale, delete the entire ``locales:`` block and
# write country / country_adjective / ... directly at the top level of this file.
locales:

  # --------------------------------------------------------------------------
  china:
    country: "China"
    country_adjective: "Chinese"
    learner_description: "adult learners of English"
    # Explicitly avoid adjacent cultures the teacher may fall into incorrectly.
    avoid_default_cultures:
      - "American"
      - "European"
    food_terms: []
    avoid_food_terms: []
    avoided_topics:
      - name: politics
        pivot_hint: "infrastructure, local services, weather, weekend plans"
      - name: religion
        pivot_hint: "cultural traditions, family holidays, food"
      - name: alcohol_dating
        pivot_hint: "friendship, weekend plans with family"
      - name: partisan_history
        pivot_hint: "general history of cities or food traditions"
      - name: violence_harm
        pivot_hint: "neighborhood safety, sports, hobbies, weekend plans — keep tone calm, do not roleplay violence, do not give instructions"
      - name: distress_self_harm
        pivot_hint: "briefly acknowledge how the learner feels with one warm sentence, gently suggest talking to a trusted family member, friend, or counselor, then ease into a light everyday topic like food or a walk; do NOT give clinical advice, do NOT roleplay a counselor"
      - name: yankee_culture
        pivot_hint: "Chinese sports like table tennis or badminton, Spring Festival or Mid-Autumn customs, local brands and pastimes"
      - name: western_culture
        pivot_hint: "Chinese sports like table tennis or badminton, Spring Festival or Mid-Autumn customs, local brands and pastimes"
      - name: law_and_national_economy
        pivot_hint: "household budgeting, daily market prices, neighborhood shopping habits"

  # --------------------------------------------------------------------------
  japan:
    country: "Japan"
    country_adjective: "Japanese"
    learner_description: "adult learners of English"
    avoid_default_cultures:
      - "American"
      - "European"
      - "Chinese"
      - "Singapore"
    food_terms: []
    avoid_food_terms: []
    avoided_topics:
      - name: politics
        pivot_hint: "neighborhood services, weather, weekend plans, transit"
      - name: religion
        pivot_hint: "seasonal festivals, family traditions, food"
      - name: alcohol_dating
        pivot_hint: "friendship, weekend plans with family"
      - name: partisan_history
        pivot_hint: "general history of cities, castles, or food traditions"
      - name: violence_harm
        pivot_hint: "neighborhood safety, sports, hobbies, weekend plans — keep tone calm, do not roleplay violence, do not give instructions"
      - name: distress_self_harm
        pivot_hint: "briefly acknowledge how the learner feels with one warm sentence, gently suggest talking to a trusted family member, friend, or counselor, then ease into a light everyday topic like food or a walk; do NOT give clinical advice, do NOT roleplay a counselor"
      - name: yankee_culture
        pivot_hint: "Japanese baseball at Koshien, sumo, local festivals, regional snacks and brands"
      - name: western_culture
        pivot_hint: "Japanese cinema and anime, J-pop or enka, NHK morning dramas"
      - name: law_and_national_economy
        pivot_hint: "household budgeting, supermarket prices, neighborhood shopping habits"

  # --------------------------------------------------------------------------
  italy:
    country: "Italy"
    country_adjective: "Italian"
    learner_description: "adult learners of English"
    avoid_default_cultures:
      - "American"
      - "British"
    food_terms: []
    avoid_food_terms: []
    avoided_topics:
      - name: politics
        pivot_hint: "local services, weather, weekend plans, transit"
      - name: religion
        pivot_hint: "cultural traditions, family holidays, food"
      - name: alcohol_dating
        pivot_hint: "friendship, family meals together"
      - name: partisan_history
        pivot_hint: "general history of cities, art, or regional cuisine"
      - name: violence_harm
        pivot_hint: "neighborhood safety, sports, hobbies, weekend plans — keep tone calm, do not roleplay violence, do not give instructions"
      - name: distress_self_harm
        pivot_hint: "briefly acknowledge how the learner feels with one warm sentence, gently suggest talking to a trusted family member, friend, or counselor, then ease into a light everyday topic like food or a walk; do NOT give clinical advice, do NOT roleplay a counselor"
      - name: yankee_culture
        pivot_hint: "Italian football (Serie A), local festivals (Carnevale, sagre), family pastimes, regional brands"
      - name: western_culture
        pivot_hint: "Italian cinema (Cinecitta), regional music and folk traditions, RAI dramas"
      - name: law_and_national_economy
        pivot_hint: "household budgeting, market prices, neighborhood shopping habits"
