[project]
name = "qwen-en-tutor"
version = "0.1.0"
description = "Fine-tune Qwen3 into a locale-grounded English conversation tutor (CEFR A1-C2). Target country configurable via config/locale.yaml."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Eric Standley", email = "ericstandley19@gmail.com" },
]
dependencies = [
    "transformers>=4.45",
    "trl",
    "peft",
    "bitsandbytes",
    "datasets",
    "accelerate",
    "anthropic",
    "openai",
    "pydantic>=2",
    "pyyaml",
    "tenacity",
    "tiktoken",
    # spacy: removed — locale-diversity extraction now uses an inline regex
    #        heuristic, no external NER dep.
    "wandb",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qwen_tutor"]

[tool.uv]
package = true

[tool.pyright]
# scripts/ inserts `src/` into sys.path at runtime; tell Pyright/Pylance
# about it so "Import qwen_tutor... could not be resolved" warnings go away
# in editors that haven't picked up the editable install.
extraPaths = ["src"]
include = ["src", "scripts", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow",
    "gpu: marks tests as requiring GPU",
    "integration: marks tests as integration tests",
]
